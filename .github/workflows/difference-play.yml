name: Difference play crucibles

on:
  pull_request:
    paths:
      - "experiments/play/**"
      - ".github/workflows/difference-play.yml"

permissions:
  contents: read

jobs:
  difference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s experiments/play -p "test_*.py" -v
      - run: python experiments/play/difference_001_relational_witness.py
