name: Experiment 001A synthetic replay

on:
  pull_request:
    paths:
      - "experiments/001a/**"
      - "requirements-dev.txt"
      - ".github/workflows/experiment-001a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest experiments/001a/test_harness.py -v
      - run: |
          python experiments/001a/harness.py experiments/001a/synthetic_manifest.json --write /tmp/receipt.json
          python experiments/001a/harness.py experiments/001a/synthetic_manifest.json --replay /tmp/receipt.json
