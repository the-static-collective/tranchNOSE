name: Machine weather experimental receipt
on:
  pull_request:
    paths:
      - "experiments/machine_weather_001.py"
      - "experiments/test_machine_weather_001.py"
      - ".github/workflows/machine-weather.yml"
permissions:
  contents: read
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s experiments -p test_machine_weather_001.py -v
